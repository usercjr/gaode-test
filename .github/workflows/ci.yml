# 每次推送和 PR 都跑：Python 单元测试、网关单元测试、两个 Docker 镜像能否构建
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true   # 同一分支连续推送时，只保留最新一次

jobs:
  python:
    name: agent_service 测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: agent_service/requirements*.txt
      - name: 安装依赖（CPU 版 torch）
        run: |
          pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
          pip install -r agent_service/requirements.txt -r agent_service/requirements-dev.txt -r agent_service/requirements-train.txt
      - name: pytest
        working-directory: agent_service
        run: python -m pytest -q tests

  gateway:
    name: 网关测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --check server.js
      - run: npm test

  docker:
    name: Docker 镜像构建
    runs-on: ubuntu-latest
    needs: [python, gateway]   # 测试通过后再构建，省时间
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: 构建网关镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: 构建 agent_service 镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          file: agent_service/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
