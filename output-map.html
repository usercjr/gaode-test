<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8" />
  <title>My Amap Trip · 行程地图</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@1/css/pico.min.css" />
  <style>
    :root {
      --sidebar-width: 320px;
      --bg-gradient: linear-gradient(145deg, #eef2ff 0%, #fdf2f8 45%, #f8fafc 100%);
      --card-bg: rgba(255, 255, 255, 0.9);
      --card-border: rgba(148, 163, 184, 0.15);
      --shadow-soft: 0 18px 45px rgba(15, 23, 42, 0.08);
      --primary: #0ea5e9;
      --primary-dark: #0284c7;
      --success: #22c55e;
      --danger: #ef4444;
      --text-muted: #64748b;
      --rounded-lg: 18px;
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      background: var(--bg-gradient);
      color: #0f172a;
    }

    body {
      display: flex;
      flex-direction: column;
    }

    .page {
      display: flex;
      gap: 28px;
      padding: 28px;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
    }

    .sidebar {
      width: var(--sidebar-width);
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--rounded-lg);
      box-shadow: var(--shadow-soft);
      backdrop-filter: blur(18px);
      padding: 24px 22px;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      gap: 18px;
    }

    .sidebar-header h3 {
      margin: 0;
      font-size: 26px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .sidebar-header p {
      margin: 6px 0 0;
      font-size: 12px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.18em;
    }

    .planner {
      display: flex;
      flex-direction: column;
      gap: 12px;
      background: rgba(14, 165, 233, 0.08);
      border: 1px solid rgba(14, 165, 233, 0.18);
      border-radius: 16px;
      padding: 16px 18px;
    }

    .planner label {
      font-size: 13px;
      font-weight: 600;
      color: #0369a1;
    }

    .planner textarea {
      width: 100%;
      min-height: 160px;
      font-size: 13px;
      line-height: 1.55;
      border-radius: 14px;
      border: 1px solid rgba(14, 165, 233, 0.35);
      padding: 12px 14px;
      background: rgba(255, 255, 255, 0.75);
      resize: vertical;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .planner textarea:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(14, 165, 233, 0.18);
    }

    .primary-btn {
      width: 100%;
      border: none;
      border-radius: 14px;
      padding: 12px 16px;
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 12px 24px rgba(14, 165, 233, 0.25);
      transition: transform 0.18s ease, box-shadow 0.18s ease;
    }

    .primary-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 16px 28px rgba(14, 165, 233, 0.3);
    }

    .primary-btn:active {
      transform: translateY(0);
      box-shadow: 0 10px 20px rgba(14, 165, 233, 0.2);
    }

    .planner .status {
      min-height: 18px;
      font-size: 12px;
      color: var(--text-muted);
    }

    .planner .status.success { color: var(--success); }
    .planner .status.error { color: var(--danger); }

    .panel {
      background: rgba(255, 255, 255, 0.8);
      border-radius: 16px;
      border: 1px solid rgba(148, 163, 184, 0.15);
      padding: 16px 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .panel label {
      font-size: 13px;
      font-weight: 600;
      color: #1e293b;
    }

    .mode-btn,
    .day-item {
      border: 1px solid rgba(148, 163, 184, 0.3);
      border-radius: 12px;
      padding: 10px 14px;
      background: rgba(255, 255, 255, 0.65);
      color: #0f172a;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.18s ease;
    }

    .mode-btn + .mode-btn,
    .day-item + .day-item {
      margin-top: 8px;
    }

    .mode-btn:hover,
    .day-item:hover {
      border-color: var(--primary);
      box-shadow: 0 10px 22px rgba(14, 165, 233, 0.12);
      transform: translateY(-1px);
    }

    .mode-btn.active {
      background: linear-gradient(135deg, #22d3ee 0%, #0ea5e9 100%);
      border-color: transparent;
      color: #fff;
      box-shadow: 0 15px 30px rgba(14, 165, 233, 0.28);
    }

    .day-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
    }

    .day-item.active {
      background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
      color: #fff;
      border-color: transparent;
      box-shadow: 0 16px 32px rgba(99, 102, 241, 0.25);
    }

    .day-item .meta {
      font-size: 12px;
      color: rgba(248, 250, 252, 0.85);
    }

    .poi-badge {
      background: #2563eb;
      color: #fff;
      padding: 3px 7px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600;
      box-shadow: 0 6px 14px rgba(37, 99, 235, 0.25);
    }

    .map-panel {
      flex: 1;
      position: relative;
      border-radius: 26px;
      overflow: hidden;
      border: 1px solid rgba(148, 163, 184, 0.2);
      box-shadow: var(--shadow-soft);
      background: #0f172a;
      min-height: 540px;
    }

    #map {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    .map-overlay {
      position: absolute;
      top: 24px;
      right: 24px;
      min-width: 220px;
      background: rgba(15, 23, 42, 0.9);
      color: #f8fafc;
      padding: 16px 18px;
      border-radius: 16px;
      border: 1px solid rgba(148, 163, 184, 0.2);
      backdrop-filter: blur(18px);
      box-shadow: 0 18px 38px rgba(15, 23, 42, 0.42);
      display: flex;
      flex-direction: column;
      gap: 8px;
      pointer-events: none;
    }

    .map-overlay h4 {
      margin: 0;
      font-size: 14px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #bae6fd;
    }

    .map-overlay p {
      margin: 0;
      font-size: 12px;
      line-height: 1.6;
      color: rgba(248, 250, 252, 0.95);
    }

    .divider {
      height: 1px;
      background: rgba(148, 163, 184, 0.18);
      margin: 6px 0;
    }

    @media (max-width: 1200px) {
      .page {
        flex-direction: column;
        height: auto;
        min-height: 100vh;
        padding: 20px;
      }

      .sidebar {
        width: 100%;
        max-height: 380px;
      }

      .map-panel {
        min-height: 460px;
      }
    }
  </style>

           • 点击侧栏按钮可重新生成地图</p>
      </div>
    </section>
  </div>

                function ensureDirectRoutes(amapJson) {
                    if (!amapJson || !amapJson.days) return;
                    amapJson.days.forEach(day => {
                        const places = day.places || [];
                        for (let i = 0; i < places.length - 1; i++) {
                            const a = places[i];
                            const b = places[i + 1];
                            if (!a.location || !b.location) continue;
                            const fromCoords = a.location.lng + ',' + a.location.lat;
                            const toCoords = b.location.lng + ',' + b.location.lat;
                            const driveKey = fromCoords + ' -> ' + toCoords + ' (drive)';
                            const walkKey = fromCoords + ' -> ' + toCoords + ' (walk)';
                            const fallbackPath = [[a.location.lng, a.location.lat], [b.location.lng, b.location.lat]];
                            if (!window.__routeCache[driveKey]) {
                                window.__routeCache[driveKey] = { path: fallbackPath, durationMin: null, mode: 'drive' };
                            }
                            if (!window.__routeCache[walkKey]) {
                                window.__routeCache[walkKey] = { path: fallbackPath, durationMin: null, mode: 'walk' };
                            }
                        }
                    });
                }

                function setGenerateStatus(msg, type = '') {
                    const el = document.getElementById('generate-status');
                    if (!el) return;
                    el.className = 'status ' + (type || '');
                    el.textContent = msg || '';
                }

                function parseItineraryText(input) {
                    const lines = (input || '')
                        .split(/\r?\n/)
                        .map(s => s.trim())
                        .filter(Boolean);
                    const dayPatterns = [
                        /^Day\s*(\d+)\s*[:：]?\s*(.*)$/i,
                        /^D\s*(\d+)\s*(.*)$/i,
                        /^第\s*(\d+)\s*天\s*[:：]?\s*(.*)$/
                    ];
                    const placeLineStart = /^[-•·]\s*(.+)$/;
                    const bracketCityRe = /^\[(?<city>[^\]\[]+)\]\s*(?<name>[^()（）]+?)(?:[（(](?<notes>.*?)[)）])?$/;
                    const sepCityRe = /^(?<city>[^·:]+?)\s*[·:]\s*(?<name>[^()（）]+?)(?:[（(](?<notes>.*?)[)）])?$/;

                    const itinerary = { title: '自定义行程', days: [] };
                    let currentDay = null;

                    for (const line of lines) {
                        let matchedDay = false;
                        for (const pattern of dayPatterns) {
                            const match = line.match(pattern);
                            if (match) {
                                const dayNum = parseInt(match[1], 10);
                                const title = (match[2] || '').trim() || ('第' + dayNum + '天');
                                currentDay = { day: dayNum, title, city: null, notes: null, places: [] };
                                itinerary.days.push(currentDay);
                                matchedDay = true;
                                break;
                            }
                        }
                        if (matchedDay) continue;

                        const pm = line.match(placeLineStart);
                        if (pm && currentDay) {
                            const body = pm[1].trim();
                            let city = null, name = null, notes = null;
                            let m = body.match(bracketCityRe);
                            if (m?.groups) {
                                city = (m.groups.city || '').trim();
                                name = (m.groups.name || '').trim();
                                notes = (m.groups.notes || '').trim() || null;
                            } else {
                                m = body.match(sepCityRe);
                                if (m?.groups) {
                                    city = (m.groups.city || '').trim();
                                    name = (m.groups.name || '').trim();
                                    notes = (m.groups.notes || '').trim() || null;
                                } else {
                                    const noteMatch = body.match(/[（(](.*?)[)）]\s*$/);
                                    if (noteMatch) {
                                        notes = noteMatch[1].trim();
                                        name = body.replace(/[（(].*[)）]\s*$/, '').trim();
                                    } else {
                                        name = body;
                                    }
                                }
                            }
                            currentDay.places.push({ name, city: city || null, notes, location: null });
                            if (!currentDay.city && city) currentDay.city = city;
                        }
                    }
                    return itinerary;
                }

                function toAmapJson(itinerary, title = 'My Amap Trip') {
                    return {
                        title,
                        days: (itinerary.days || []).map(day => ({
                            title: day.title || null,
                            city: day.city || null,
                            notes: day.notes ?? null,
                            places: (day.places || []).map(p => ({
                                name: p.name,
                                address: p.address || null,
                                location: p.location || null,
                                type: p.type || null,
                                status: p.status || null,
                                notes: p.notes ?? null,
                                city: p.city ?? null,
                                cityUsedForSearch: p.cityUsedForSearch || null
                            }))
                        }))
                    };
                }

                function inferCityFromTitle(title = '') {
                    const list = ['北京','上海','广州','深圳','杭州','南京','苏州','武汉','西安','成都','重庆','厦门','青岛','天津','哈尔滨','沈阳','长沙','合肥','郑州','福州','三亚','昆明','桂林'];
                    return list.find(c => title.includes(c)) || null;
                }

                function dedupeList(arr) {
                    const out = [];
                    const seen = new Set();
                    for (const item of arr) {
                        const v = (item || '').trim();
                        if (!v || seen.has(v)) continue;
                        seen.add(v);
                        out.push(v);
                    }
                    return out;
                }

                function normalizeCityName(city = '') {
                    return (city || '').trim().replace(/市$/u, '');
                }

                function buildCityCandidates(cityHint = '') {
                    const c = (cityHint || '').trim();
                    if (!c) return [''];
                    const noSuffix = normalizeCityName(c);
                    return dedupeList([c, noSuffix, noSuffix ? (noSuffix + '市') : '', '']);
                }

                function cleanPlaceName(raw = '') {
                    return (raw || '')
                        .trim()
                        .replace(/^[\d一二三四五六七八九十]+[.\-、:：）)]\s*/u, '')
                        .replace(/[（(].*?[)）]\s*$/u, '')
                        .replace(/^["“”'‘’`]+|["“”'‘’`]+$/gu, '')
                        .trim();
                }

                function buildPlaceNameCandidates(rawName = '') {
                    const base = cleanPlaceName(rawName);
                    const noSpace = base.replace(/\s+/g, '');
                    const noDot = noSpace.replace(/[·•]/g, '');
                    const light = noDot.replace(/(旅游景区|风景名胜区|风景区|景区|景点|打卡点|网红打卡地|网红景点)$/u, '').trim();
                    return dedupeList([base, noSpace, noDot, light]);
                }

                function parseLngLat(locationText = '') {
                    const parts = (locationText || '').split(',');
                    if (parts.length !== 2) return null;
                    const lng = Number(parts[0]);
                    const lat = Number(parts[1]);
                    if (!Number.isFinite(lng) || !Number.isFinite(lat)) return null;
                    return { lng, lat };
                }

                function scorePoi(poi, keyword, cityHint) {
                    const poiName = (poi?.name || '').trim();
                    const kw = (keyword || '').trim();
                    const kwNoSpace = kw.replace(/\s+/g, '');
                    const nameNoSpace = poiName.replace(/\s+/g, '');
                    const poiCity = normalizeCityName(poi?.cityname || '');
                    const hint = normalizeCityName(cityHint || '');
                    let score = 0;
                    if (poiName === kw || nameNoSpace === kwNoSpace) score += 10;
                    if (poiName.includes(kw) || kw.includes(poiName)) score += 5;
                    if (hint && poiCity && poiCity.includes(hint)) score += 6;
                    if (poi?.adname) score += 1;
                    return score;
                }

                function toResultFromPoi(poi, fallbackName, cityUsedForSearch) {
                    const ll = parseLngLat(poi?.location || '');
                    if (!ll) return null;
                    return {
                        lng: ll.lng,
                        lat: ll.lat,
                        address: (poi?.pname || '') + (poi?.cityname || '') + (poi?.adname || '') + (poi?.address || '') || fallbackName,
                        province: poi?.pname || null,
                        city: poi?.cityname || cityUsedForSearch || null,
                        district: poi?.adname || null,
                        adcode: poi?.adcode || null,
                        cityUsedForSearch: cityUsedForSearch || null
                    };
                }

                async function searchPoiByKeyword(keyword, cityHint, cityLimit) {
                    const queryCity = cityHint || '';
                    const url = AMAP_PROXY_BASE + '/place-text?keywords='
                        + encodeURIComponent(keyword)
                        + '&city=' + encodeURIComponent(queryCity)
                        + '&citylimit=' + (cityLimit ? 'true' : 'false')
                        + '&offset=10&page=1&extensions=base';
                    const resp = await fetch(url);
                    const data = await resp.json();
                    if (data.status !== '1' || !Array.isArray(data.pois) || !data.pois.length) return null;

                    const pois = data.pois
                        .map(poi => ({ poi, score: scorePoi(poi, keyword, cityHint) }))
                        .sort((a, b) => b.score - a.score);
                    return pois[0]?.poi || null;
                }

                async function geocodeByAddress(name, cityHint) {
                    const queryCity = cityHint || '';
                    const url = AMAP_PROXY_BASE + '/geocode?address='
                        + encodeURIComponent(name)
                        + '&city=' + encodeURIComponent(queryCity);
                    const resp = await fetch(url);
                    const data = await resp.json();
                    if (data.status !== '1' || !Array.isArray(data.geocodes) || !data.geocodes.length) return null;
                    const geo = data.geocodes[0];
                    const ll = parseLngLat(geo.location || '');
                    if (!ll) return null;
                    return {
                        lng: ll.lng,
                        lat: ll.lat,
                        address: geo.formatted_address || name,
                        province: geo.province || null,
                        city: geo.city || queryCity || null,
                        district: geo.district || null,
                        adcode: geo.adcode || null,
                        cityUsedForSearch: queryCity || null
                    };
                }

                async function geocodePlace(name, cityHint) {
                    const normalizedName = cleanPlaceName(name);
                    const normalizedCity = (cityHint || '').trim();
                    const cacheKey = normalizedName + '|' + normalizedCity;
                    if (window.__geocodeCache[cacheKey]) return window.__geocodeCache[cacheKey];

                    const nameCandidates = buildPlaceNameCandidates(normalizedName);
                    const cityCandidates = buildCityCandidates(normalizedCity);

                    // 1) POI检索（同城优先，解决“景点名不是标准地址”导致的匹配失败）
                    for (const city of cityCandidates.filter(Boolean)) {
                        for (const candName of nameCandidates) {
                            try {
                                const poi = await searchPoiByKeyword(candName, city, true);
                                const result = poi ? toResultFromPoi(poi, candName, city) : null;
                                if (result) {
                                    window.__geocodeCache[cacheKey] = result;
                                    return result;
                                }
                            } catch (err) {
                                console.warn('POI search failed:', candName, city, err);
                            }
                        }
                    }

                    // 2) POI检索（全国兜底）
                    for (const candName of nameCandidates) {
                        try {
                            const poi = await searchPoiByKeyword(candName, '', false);
                            const result = poi ? toResultFromPoi(poi, candName, normalizedCity) : null;
                            if (result) {
                                window.__geocodeCache[cacheKey] = result;
                                return result;
                            }
                        } catch (err) {
                            console.warn('POI nationwide search failed:', candName, err);
                        }
                    }

                    // 3) 地址地理编码兜底
                    for (const city of cityCandidates) {
                        for (const candName of nameCandidates) {
                            try {
                                const result = await geocodeByAddress(candName, city);
                                if (result) {
                                    window.__geocodeCache[cacheKey] = result;
                                    return result;
                                }
                            } catch (err) {
                                console.warn('Geocode fallback failed:', candName, city, err);
                            }
                        }
                    }

                    throw new Error('无法获取 ' + name + ' 的坐标（已尝试多种名称与城市组合）');
                }

                async function geocodeItinerary(itinerary) {
                    const unresolved = [];
                    for (const day of itinerary.days) {
                        for (const place of day.places) {
                            if (place.location) continue;
                            try {
                                const cityGuess = place.city || day.city || inferCityFromTitle(day.title) || '';
                                const result = await geocodePlace(place.name, cityGuess);
                                if (result) {
                                    place.location = result;
                                    place.address = result.address || place.address || null;
                                    place.cityUsedForSearch = result.cityUsedForSearch || cityGuess || null;
                                } else {
                                    unresolved.push(place.name);
                                }
                                await new Promise(r => setTimeout(r, 150));
                            } catch (err) {
                                unresolved.push(place.name);
                                console.warn('Geocode failed:', place.name, err);
                            }
                        }
                    }
                    if (unresolved.length) {
                        console.warn('Unresolved POIs:', unresolved);
                    }
                    return itinerary;
                }

                function parsePolyline(polylineStr) {
                    if (!polylineStr) return [];
                    return polylineStr.split(';').map(pair => {
                        const [lng, lat] = pair.split(',').map(Number);
                        if (Number.isFinite(lng) && Number.isFinite(lat)) return [lng, lat];
                        return null;
                    }).filter(Boolean);
                }

                async function fetchRouteSegment(from, to, mode = 'drive') {
                    const origin = from.lng + ',' + from.lat;
                    const destination = to.lng + ',' + to.lat;
                    const cacheKey = origin + ' -> ' + destination + ' (' + mode + ')';

                    let url;
                    if (mode === 'drive') {
                        url = AMAP_PROXY_BASE + '/driving?origin=' + origin + '&destination=' + destination + '&output=json';
                    } else if (mode === 'walk') {
                        url = AMAP_PROXY_BASE + '/walking?origin=' + origin + '&destination=' + destination + '&output=json';
                    } else {
                        return false;
                    }

                    try {
                        const resp = await fetch(url);
                        const data = await resp.json();
                        if (data.status === '1' && data.route && data.route.paths && data.route.paths.length > 0) {
                            const pathData = data.route.paths[0];
                            const steps = pathData.steps || [];
                            const path = steps.flatMap(step => parsePolyline(step.polyline));
                            if (path.length < 2) return false;
                            const seconds = Number(pathData.duration || 0);
                            const minutes = +(seconds / 60 || 0).toFixed(1);
                            window.__routeCache[cacheKey] = { path, durationMin: minutes, mode };
                            return true;
                        }
                    } catch (err) {
                        console.warn('Route fetch failed (' + mode + '):', err);
                    }
                    return false;
                }

                async function updateRoutesForItinerary(amapJson) {
                    if (!amapJson || !amapJson.days) return;
                    for (const day of amapJson.days) {
                        const places = day.places || [];
                        for (let i = 0; i < places.length - 1; i++) {
                            const a = places[i];
                            const b = places[i + 1];
                            if (!a.location || !b.location) continue;
                            await fetchRouteSegment(a.location, b.location, 'drive');
                            await new Promise(r => setTimeout(r, 180));
                            await fetchRouteSegment(a.location, b.location, 'walk');
                            await new Promise(r => setTimeout(r, 180));
                        }
                    }
                }

                async function regenerateMapFromText(rawText) {
                    setGenerateStatus('正在解析行程...', '');
                    const itinerary = parseItineraryText(rawText);
                    if (!itinerary.days.length) {
                        setGenerateStatus('未解析出任何 Day，请检查行程格式。', 'error');
                        return;
                    }
                    setGenerateStatus('正在获取坐标，稍候...', '');
                    await geocodeItinerary(itinerary);
                    const unresolvedCount = itinerary.days
                        .flatMap(day => day.places || [])
                        .filter(p => !p.location)
                        .length;
                    const amapJson = toAmapJson(itinerary, itinerary.title || '自定义行程');
                    await updateRoutesForItinerary(amapJson);
                    const tripDataEl = document.getElementById('trip-data');
                    tripDataEl.textContent = JSON.stringify(amapJson);
                    ensureDirectRoutes(amapJson);
                    const titleEl = document.getElementById('trip-title');
                    if (titleEl && amapJson.title) {
                        titleEl.textContent = amapJson.title;
                    }
                    try {
                        localStorage.setItem('wanderAi.itineraryText', rawText);
                        localStorage.setItem('wanderAi.itineraryJson', JSON.stringify(amapJson));
                        if (amapJson.title) localStorage.setItem('wanderAi.itineraryTitle', amapJson.title);
                    } catch (_) {
                        /* ignore storage errors */
                    }
                    const updatedRouteCache = await window.AmapTripRenderer.init(amapJson, null, AMAP_JS_KEY, window.__routeCache);
                    if (updatedRouteCache) window.__routeCache = updatedRouteCache;
                    if (unresolvedCount > 0) {
                        setGenerateStatus('⚠️ 地图已更新，但有 ' + unresolvedCount + ' 个景点未匹配到坐标，相关路段会跳过。', 'error');
                    } else {
                        setGenerateStatus('✅ 地图已更新', 'success');
                    }
                }

                document.addEventListener('DOMContentLoaded', () => {
                    const tripDataEl = document.getElementById('trip-data');
                    const textarea = document.getElementById('itinerary-input');
                    const titleEl = document.getElementById('trip-title');
                    let storedText = '';
                    let storedJsonRaw = '';
                    let storedTitle = '';
                    try {
                        storedText = localStorage.getItem('wanderAi.itineraryText') || '';
                        storedJsonRaw = localStorage.getItem('wanderAi.itineraryJson') || '';
                        storedTitle = localStorage.getItem('wanderAi.itineraryTitle') || '';
                    } catch (_) {
                        storedText = '';
                        storedJsonRaw = '';
                        storedTitle = '';
                    }

                    if (storedTitle && titleEl) {
                        titleEl.textContent = storedTitle;
                    }

                    if (textarea) {
                        if (storedText) {
                            textarea.value = storedText;
                        } else if (!textarea.value.trim()) {
                            textarea.value = "第1天 上海经典地标\r\n- [上海] 外滩（夜景最佳，建议19:00后）\r\n- [上海] 南京东路（购物）\r\n- [上海] 人民广场（市中心漫步）\r\n\r\n第2天 上海城市地标\r\n- [上海] 豫园（古典园林）\r\n- [上海] 城隍庙（老街小吃）\r\n- [上海] 陆家嘴（摩天大楼）\r\n\r\n第3天 上海文化与科技\r\n- [上海] 上海博物馆（文化展览）\r\n- [上海] 上海科技馆（互动体验）\r\n- [上海] 东方明珠（登塔俯瞰上海）\r\n";
                        }
                    }
                    const btn = document.getElementById('generate-btn');

                    let initialData;
                    try {
                        initialData = JSON.parse(tripDataEl.textContent || '{}');
                    } catch (_) {
                        initialData = { days: [] };
                    }

                    if (storedJsonRaw) {
                        try {
                            const storedJson = JSON.parse(storedJsonRaw);
                            if (storedJson && storedJson.days && storedJson.days.length) {
                                tripDataEl.textContent = JSON.stringify(storedJson);
                                initialData = storedJson;
                            }
                        } catch (_) {
                            /* invalid json ignored */
                        }
                    }

                    const autoText = storedText && storedText.trim();
                    if (autoText) {
                        setGenerateStatus('🔄 正在根据 AI 行程生成地图...', '');
                        regenerateMapFromText(autoText).catch(err => {
                            console.error(err);
                            setGenerateStatus('❌ 自动生成失败：' + (err.message || err), 'error');
                        });
                    } else {
                        (async () => {
                            await updateRoutesForItinerary(initialData);
                            ensureDirectRoutes(initialData);
                            const updatedRouteCache = await window.AmapTripRenderer.init(initialData, null, AMAP_JS_KEY, window.__routeCache);
                            if (updatedRouteCache) window.__routeCache = updatedRouteCache;
                        })();
                    }

                    if (btn) {
                        btn.addEventListener('click', async () => {
                            const value = (textarea?.value || '').trim();
                            if (!value) {
                                setGenerateStatus('请输入行程文本后再生成地图', 'error');
                                return;
                            }
                            try {
                                const itinerary = parseItineraryText(value);
                                if (!itinerary.days.length) {
                                    setGenerateStatus('未解析出任何 Day，请检查行程格式。', 'error');
                                    return;
                                }
                                await regenerateMapFromText(value);
                            } catch (err) {
                                console.error(err);
                                setGenerateStatus('❌ 生成失败：' + (err.message || err), 'error');
                            }
                        });
                    }
                });
            </script>
