<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8" />
  <title>WanderAI 智能旅行助手</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="data:,">
  <style>
    :root {
      --bg-gradient: linear-gradient(145deg, #eef2ff 0%, #fdf2f8 45%, #f8fafc 100%);
      --card-bg: rgba(255, 255, 255, 0.92);
      --card-border: rgba(148, 163, 184, 0.18);
      --shadow-soft: 0 22px 48px rgba(15, 23, 42, 0.12);
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --accent: #f97316;
      --muted: #64748b;
      --success: #16a34a;
      --danger: #ef4444;
      --radius-lg: 22px;
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg-gradient);
      color: #0f172a;
      padding: 32px clamp(16px, 4vw, 48px);
      display: flex;
      flex-direction: column;
      gap: 28px;
    }

    a { color: inherit; }

    .app-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
    }

    .branding {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .branding .logo {
      width: 58px;
      height: 58px;
      border-radius: 22px;
      background: rgba(37, 99, 235, 0.12);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
      box-shadow: 0 12px 24px rgba(37, 99, 235, 0.18);
    }

    .branding h1 {
      margin: 0;
      font-size: clamp(22px, 4vw, 28px);
      font-weight: 700;
    }

    .branding p {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 14px;
    }

    .view-map-btn {
      border: none;
      border-radius: 999px;
      padding: 12px 24px;
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
      color: #fff;
      font-weight: 600;
      font-size: 15px;
      cursor: pointer;
      box-shadow: 0 15px 28px rgba(37, 99, 235, 0.28);
      transition: transform 0.18s ease, box-shadow 0.18s ease, opacity 0.18s ease;
    }

    .view-map-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      box-shadow: none;
    }

    .view-map-btn:not(:disabled):hover {
      transform: translateY(-1px);
      box-shadow: 0 18px 34px rgba(37, 99, 235, 0.32);
    }

    main {
      display: grid;
      grid-template-columns: minmax(320px, 420px) minmax(380px, 1fr);
      gap: 28px;
      flex: 1;
    }

    .planner-card,
    .chat-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-soft);
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 18px;
      backdrop-filter: blur(14px);
    }

    .planner-card h2 {
      margin: 0;
      font-size: 18px;
      font-weight: 600;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 14px;
    }

    .input-field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .input-field label {
      font-size: 13px;
      font-weight: 600;
      color: #1e293b;
    }

    .input-field input,
    .input-field select {
      border-radius: 12px;
      border: 1px solid rgba(148, 163, 184, 0.35);
      background: rgba(255, 255, 255, 0.85);
      padding: 12px 14px;
      font-size: 14px;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .input-field input:focus,
    .input-field select:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.18);
    }

    .preference-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      border-radius: 16px;
      background: rgba(37, 99, 235, 0.07);
      border: 1px solid rgba(37, 99, 235, 0.18);
    }

    .pref-trigger {
      border: none;
      background: rgba(37, 99, 235, 0.12);
      color: var(--primary-dark);
      padding: 10px 16px;
      border-radius: 999px;
      font-weight: 600;
      cursor: pointer;
    }

    .pref-summary {
      font-size: 13px;
      color: var(--muted);
      flex: 1;
      text-align: right;
    }

    .action-row {
      display: flex;
      justify-content: flex-end;
      gap: 12px;
    }

    .btn-secondary,
    .btn-primary,
    .btn-ghost,
    .btn-link {
      border-radius: 12px;
      padding: 11px 18px;
      font-size: 14px;
      cursor: pointer;
      border: none;
      transition: transform 0.18s ease, box-shadow 0.18s ease, opacity 0.18s ease;
    }

    .btn-secondary {
      background: rgba(37, 99, 235, 0.08);
      color: var(--primary-dark);
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--accent) 0%, #f97316 40%, #fb923c 100%);
      color: #fff;
      font-weight: 600;
      box-shadow: 0 15px 28px rgba(249, 115, 22, 0.28);
    }

    .btn-ghost {
      background: transparent;
      border: 1px solid rgba(148, 163, 184, 0.35);
      color: #1e293b;
    }

    .btn-link {
      background: transparent;
      color: var(--muted);
      padding: 8px 10px;
    }

    .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 18px 34px rgba(249, 115, 22, 0.32); }
    .btn-secondary:hover, .btn-ghost:hover { transform: translateY(-1px); }
    .btn-link:hover { color: var(--primary); }

    .muted { color: var(--muted); font-size: 12px; }
    .llm-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .llm-grid .full { grid-column: 1 / -1; }

    .chat-card {
      position: relative;
    }

    .chat-log {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
      padding-right: 4px;
    }

    .message {
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-width: 92%;
    }

    .message .meta {
      font-size: 12px;
      color: var(--muted);
    }

    .bubble {
      padding: 14px 16px;
      border-radius: 18px;
      box-shadow: 0 8px 20px rgba(15, 23, 42, 0.08);
      line-height: 1.6;
      white-space: pre-wrap;
    }

    .message.user {
      align-self: flex-end;
      align-items: flex-end;
    }

    .message.user .bubble {
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
      color: #fff;
      border-bottom-right-radius: 6px;
    }

    .message.ai .bubble {
      background: rgba(37, 99, 235, 0.08);
      border: 1px solid rgba(37, 99, 235, 0.15);
      border-bottom-left-radius: 6px;
    }

    .message.system .bubble {
      background: rgba(148, 163, 184, 0.15);
      color: #1f2937;
      border-radius: 14px;
    }

    .chat-toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 6px;
    }

    .chat-composer {
      display: flex;
      gap: 10px;
      align-items: flex-end;
      margin-top: 10px;
    }

    .chat-composer textarea {
      flex: 1;
      min-height: 42px;
      max-height: 140px;
      resize: vertical;
      border-radius: 12px;
      border: 1px solid rgba(148, 163, 184, 0.35);
      background: rgba(255, 255, 255, 0.92);
      padding: 10px 12px;
      font-size: 14px;
      line-height: 1.5;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .chat-composer textarea:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.18);
    }

    .pref-dialog {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.3);
      display: none;
      justify-content: center;
      align-items: center;
      padding: 24px;
      z-index: 40;
    }

    .pref-dialog.active { display: flex; }

    .pref-content {
      width: min(640px, 92vw);
      background: var(--card-bg);
      border-radius: 20px;
      border: 1px solid var(--card-border);
      box-shadow: var(--shadow-soft);
      padding: 24px 28px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      max-height: 80vh;
      overflow-y: auto;
    }

    .pref-content h3 {
      margin: 0;
      font-size: 18px;
      font-weight: 600;
    }

    .pref-section {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .pref-section h4 {
      margin: 0;
      font-size: 14px;
      font-weight: 600;
      color: #1e293b;
    }

    .pref-options {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .pref-tag {
      border-radius: 12px;
      padding: 10px 14px;
      background: rgba(255, 255, 255, 0.92);
      border: 1px solid rgba(148, 163, 184, 0.35);
      cursor: pointer;
      font-size: 14px;
      display: inline-flex;
      gap: 8px;
      align-items: center;
      transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
    }

    .pref-tag.active {
      background: rgba(37, 99, 235, 0.18);
      border-color: rgba(37, 99, 235, 0.45);
      box-shadow: 0 10px 22px rgba(37, 99, 235, 0.18);
    }

    .dialog-actions {
      display: flex;
      justify-content: flex-end;
      gap: 12px;
      padding-top: 10px;
    }

    .toast {
      position: fixed;
      top: 24px;
      right: 24px;
      padding: 12px 18px;
      border-radius: 999px;
      color: #fff;
      font-size: 14px;
      box-shadow: 0 18px 30px rgba(15, 23, 42, 0.25);
      opacity: 0;
      transform: translateY(-12px);
      transition: opacity 0.2s ease, transform 0.2s ease;
      z-index: 50;
    }

    .toast.show { opacity: 1; transform: translateY(0); }

    .toast.success { background: linear-gradient(135deg, var(--success) 0%, #22c55e 100%); }
    .toast.error { background: linear-gradient(135deg, var(--danger) 0%, #ef4444 100%); }

    @media (max-width: 1080px) {
      main {
        grid-template-columns: 1fr;
      }
      .view-map-btn { align-self: flex-start; }
    }
  </style>
</head>
<body>
  <header class="app-header">
    <div class="branding">
      <div class="logo">🌍</div>
      <div>
        <h1>行界 WanderAI · 智能旅行助手</h1>
        <p>与 AI 对话获取专属行程，随时切换到地图视图</p>
      </div>
    </div>
    <button class="view-map-btn" id="viewMapBtn">查看地图</button>
  </header>

  <main>
    <section class="planner-card">
      <h2>旅程信息</h2>
      <div class="form-grid">
        <div class="input-field">
          <label for="field-origin">出发地</label>
          <input id="field-origin" type="text" placeholder="如 Shanghai" autocomplete="off" />
        </div>
        <div class="input-field">
          <label for="field-destination">目的地</label>
          <input id="field-destination" type="text" placeholder="如 成都" autocomplete="off" />
        </div>
        <div class="input-field">
          <label for="field-date">日期 / 时间</label>
          <input id="field-date" type="date" />
        </div>
        <div class="input-field">
          <label for="field-days">天数</label>
          <select id="field-days">
            <option value="1">1 天</option>
            <option value="2">2 天</option>
            <option value="3" selected>3 天</option>
            <option value="4">4 天</option>
            <option value="5">5 天</option>
          </select>
        </div>
        <div class="input-field">
          <label for="field-note">补充需求（可选）</label>
          <input id="field-note" type="text" maxlength="200" placeholder="如 带爸妈，不想太累，想吃本地小吃" autocomplete="off" />
        </div>
      </div>

      <div class="preference-row">
        <button class="pref-trigger" id="prefTrigger">选择偏好</button>
        <div class="pref-summary" id="prefSummary">尚未选择</div>
      </div>

      <div class="action-row">
        <button class="btn-secondary" id="manualBtn">手动创建线路</button>
        <button class="btn-primary" id="aiPlanBtn">⚡ AI规划行程</button>
      </div>
    </section>

    <section class="chat-card">
      <div class="chat-log" id="chatLog"></div>
      <div class="chat-toolbar">
        <button class="btn-link" id="clearChatBtn">清空会话</button>
        <div class="chat-actions">
          <button class="btn-ghost" id="secondaryMapBtn">查看地图</button>
        </div>
      </div>
      <div class="chat-composer">
        <textarea id="chatInput" placeholder="继续对话，例如：预算 2000 元内，增加夜景和美食，减少步行距离"></textarea>
        <button class="btn-primary" id="chatSendBtn">发送</button>
      </div>
    </section>
  </main>

  <div class="pref-dialog" id="prefDialog">
    <div class="pref-content">
      <h3>旅行偏好</h3>
      <div id="prefContainer"></div>
      <div class="dialog-actions">
        <button class="btn-ghost" id="prefCancel">取消</button>
        <button class="btn-primary" id="prefConfirm">确定</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const preferenceGroups = [
      {
        title: '同行伙伴',
        key: 'companions',
        options: [
          { id: 'solo', label: '独自出行', icon: '🧳' },
          { id: 'family', label: '家庭出行', icon: '👨‍👩‍👧‍👦' },
          { id: 'couple', label: '情侣出行', icon: '💑' },
          { id: 'friends', label: '朋友出行', icon: '🧑‍🤝‍🧑' },
          { id: 'seniors', label: '老人同行', icon: '🧓' }
        ]
      },
      {
        title: '风格偏好',
        key: 'styles',
        options: [
          { id: 'culture', label: '文化体验', icon: '🎭' },
          { id: 'mustsee', label: '经典必去', icon: '📸' },
          { id: 'nature', label: '自然风光', icon: '🌿' },
          { id: 'city', label: '城市景观', icon: '🏙️' },
          { id: 'history', label: '历史古迹', icon: '🏛️' }
        ]
      },
      {
        title: '行程节奏',
        key: 'pace',
        options: [
          { id: 'tight', label: '紧凑', icon: '⚡' },
          { id: 'easy', label: '宽松', icon: '🌴' }
        ]
      },
      {
        title: '模型风格标签（8类）',
        key: 'model_labels',
        options: [
          { id: 'ml_Rush_Trip', label: '特种兵快游', icon: '🎯', modelLabel: 'Rush_Trip' },
          { id: 'ml_Deep_Cultural_Trip', label: '深度文化', icon: '📚', modelLabel: 'Deep_Cultural_Trip' },
          { id: 'ml_Food_Adventure', label: '美食探店', icon: '🍜', modelLabel: 'Food_Adventure' },
          { id: 'ml_Nature_Relaxation', label: '自然疗愈', icon: '🌿', modelLabel: 'Nature_Relaxation' },
          { id: 'ml_City_Leisure_Tour', label: 'Citywalk', icon: '🏙️', modelLabel: 'City_Leisure_Tour' },
          { id: 'ml_Customized_AI_Tour', label: '智能综合', icon: '🤖', modelLabel: 'Customized_AI_Tour' },
          { id: 'ml_Vlog_Creator_Trip', label: 'Vlog 创作', icon: '🎥', modelLabel: 'Vlog_Creator_Trip' },
          { id: 'ml_Photo_Experience', label: '拍照出片', icon: '📸', modelLabel: 'Photo_Experience' }
        ]
      }
    ];

    // 结合你的微调 Prompt 风格标签（来自 CLI 版本的设计）
    const LABEL_PROMPTS = {
      Rush_Trip: '🎯【特种兵式高效快游风格】用户要在最短时间打卡最多景点！像这样写——“早上6点趁没人先冲xx，拍完照骑共享单车10分钟杀到xx，省去排队直接冲二楼观景台📍”。规划规则：一天5+景点紧凑排列；每个景点标注建议停留时间（如”30min速览”）；必须标注景点间交通方式和耗时；提供排队太长时的备选方案。',
      Deep_Cultural_Trip: '📚【深度文化体验风格】像文化博主一样讲故事——“站在这座600年的城墙上，脚下每一块砖都刻着工匠的名字，这是明朝的质量追溯系统啊”。规划规则：每个景点附1-2句文化背景小故事；标注是否需要预约、讲解器租赁（价格）；注明闭馆日和最佳参观时段；推荐周边值得驻足的文创小店。',
      Food_Adventure: '🍜【美食探店风格】像美食博主一样写——“这家的红油抄手我愿意排40分钟！皮薄馅大，红油香而不辣，2块钱一个简直离谱😭”。规划规则：每天安排2~4家餐厅为主线；每家必须写：人均消费、必点菜1-3道、最佳到店时间、排队预估；景点穿插在餐厅之间作为消食散步；标注夜市/早餐/深夜食堂的营业时间。',
      Nature_Relaxation: '🌿【自然放松疗愈风格】像治愈系博主一样写——“清晨的湖面起了薄雾，坐在栈道上发呆听鸟叫，这一刻觉得请假太值了🍃”。规划规则：一天最多3个地点，节奏放慢；推荐最佳观景时间段（如日出/黄昏/雨后）；安排轻徒步路线标注难度和耗时；穿插休息点如湖边咖啡馆或草坪野餐。',
      City_Leisure_Tour: '🏙️【城市休闲 Citywalk 风格】像city walk博主一样写——“从xx巷子拐进去，整条街都是梧桐树荫，走两步就有一家藏在老洋房里的咖啡馆☕”。规划规则：设计步行可串联的路线；强调街区氛围和偶遇感；推荐特色咖啡馆/独立书店/小众买手店（附人均）；加入适合散步的时间段和夜景路线。',
      Customized_AI_Tour: '🤖【智能综合行程规划风格】平衡效率和体验——“上午打卡经典地标，下午钻进本地人才知道的小街巷，晚上去评分最高的那家馆子犒劳自己”。规划规则：综合考虑景点分布避免折返；每段附交通方式和预估时长；标注人均费用；经典景点和小众体验穿插搭配。',
      Vlog_Creator_Trip: '🎥【Vlog 创作者风格】像vlog博主一样写——“这个转角一定要拍！逆光走过来，背景刚好是整条古街的纵深感，氛围感直接拉满🎬”。规划规则：语言口语化有画面感；标注出片点位和推荐拍摄角度；安排有节奏的场景切换（安静→热闹→安静）；提示最佳光线时间和避开人流的技巧。',
      Photo_Experience: '📸【拍照打卡出片风格】像摄影博主一样写——“下午4点的光线打在红墙上绝了！站在台阶第三级，侧身回头看镜头，随手一拍就是氛围大片”。规划规则：每个景点标注最佳拍摄时间和光线方向；推荐具体机位和构图方式；提供穿搭/道具建议；标注人少的时间段和避开游客的小技巧。'
    };

    function buildSystemPromptByLabel(label) {
      const head = LABEL_PROMPTS[label] || LABEL_PROMPTS.Customized_AI_Tour;
      return head + ' 请在不改变输出格式的前提下，尽量体现上述风格偏好。';
    }

    const selectedPreferences = new Set();
    const chatLogEl = document.getElementById('chatLog');
    const toastEl = document.getElementById('toast');
    const viewMapButtons = [
      document.getElementById('viewMapBtn'),
      document.getElementById('secondaryMapBtn')
    ];

    const state = {
      itineraryText: '',
      itineraryJson: null,
      chatHistory: [],
      tripContext: null,
      systemExtra: '',
      ragSnippets: '',
      agentItinerary: null  // Agent 返回的结构化行程，多轮修改时回传
    };
    const MAX_CHAT_MESSAGES = 30;

    // 统一的 API 基址，确保从任何入口打开页面都能命中同源代理
    const API_BASE = window.location.origin;
    // 调试日志：页面地址加 ?debug 开启
    const DEBUG = new URLSearchParams(window.location.search).has('debug');

    function renderPreferenceOptions() {
      const container = document.getElementById('prefContainer');
      container.innerHTML = '';
      preferenceGroups.forEach(group => {
        const section = document.createElement('div');
        section.className = 'pref-section';

    function buildItineraryInstruction({ origin, destination, date, preferences, systemExtra, ragSnippets }) {
      let sys = `你是一个资深旅行博主兼行程规划师。你需要像小红书热门攻略一样，用生动、有温度的语言输出行程。

【输出格式要求】
严格按如下格式输出，不要额外解释或添加 markdown 代码块：

- [城市] 景点名（实用备注）

格式规则：

【内容风格要求】
1. 像朋友在分享旅行经历一样写——不要百科式介绍，要有体验感和温度

3. 推荐理由要具体生动：不说”风景优美”，要说”日落时分站在九眼桥上能看到整条锦江的金色光带✨”
4. 适当使用emoji增加可读性（每个景点1-2个），但不要堆砌
5. 行程安排要合理：考虑景点之间的距离和交通，标注交通方式和大约耗时
6. 不要输出除行程文本以外的任何内容`;

      if (systemExtra && typeof systemExtra === 'string') {
        sys += `\n\n【风格偏好补充】\n${systemExtra}`;
      }

      if (ragSnippets && ragSnippets.trim()) {
        sys += `\n\n【参考素材——真实旅行者的笔记】\n以下是其他旅行者分享的真实体验，请从中提取有价值的信息（如具体店名、实用tips、踩坑经验）融入你的行程推荐，但不要照搬原文：\n\n${ragSnippets}`;
      }

      const tripContext = `出发地：${origin || '未填写'}；目的地：${destination || '未填写'}；日期：${date || '未填写'}；偏好：${(preferences || []).join('、') || '未选择'}。`;
      return `${sys}\n\n【固定背景】\n${tripContext}\n\n【多轮对话要求】\n你将基于后续对话历史持续优化同一份行程。如果用户提出修改需求，在保持上述风格的前提下调整行程。`;
    }

    function trimChatHistory() {

    function showToast(message, type = 'success') {

    function setMapButtonsEnabled(enabled) {
      viewMapButtons.forEach(btn => {

        btn.style.opacity = enabled ? '1' : '0.6';

    // ========== LLM 设置（隐藏在代码中）与调用 ==========
    const LLM_CONFIG = {
      enabled: true,
      // 走网关代理；模型与密钥都在 agent_service 配置，前端不携带
      endpoint: '/api/itinerary'
    };

    function getLLMSettings() {
      const { enabled, endpoint } = LLM_CONFIG || {};
      return { ep: enabled ? endpoint : '' };
    }

    // 接口错误：携带统一错误格式里的 code / retryable / request_id
    class ApiError extends Error {
      constructor(message, { code = 'INTERNAL', retryable = false, requestId = '', status = 0 } = {}) {
        super(message);
        this.code = code;
        this.retryable = retryable;
        this.requestId = requestId;
        this.status = status;
      }
    }

    // 统一的 POST JSON 请求：超时、错误体解析、日志
    async function postJson(path, body, { timeoutMs = 30000, tag = 'api' } = {}) {
      if (DEBUG) console.log(`[${tag}] POST`, path, body);
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), timeoutMs);
      let resp;
      try {
        resp = await fetch(`${API_BASE}${path}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
          signal: controller.signal
        });
      } catch (e) {
        if (e.name === 'AbortError') throw new ApiError('请求超时，请稍后重试', { code: 'CLIENT_TIMEOUT', retryable: true });
        throw new ApiError('无法连接服务，请检查网关是否启动', { code: 'NETWORK_ERROR', retryable: true });
      } finally {
        clearTimeout(timeoutId);
      }
      const requestId = resp.headers.get('X-Request-ID') || '';
      const data = await resp.json().catch(() => null);
      if (!resp.ok) {
        const err = data?.error || {};
        if (DEBUG) console.error(`[${tag}] error`, resp.status, data);
        throw new ApiError(err.message || `接口错误 ${resp.status}`, {
          code: err.code, retryable: !!err.retryable, requestId: err.request_id || requestId, status: resp.status
        });
      }
      if (DEBUG) console.log(`[${tag}] ok`, data);
      if (data?.degraded?.length) console.warn(`[${tag}] degraded:`, data.degraded);
      return data;
    }

    // 给用户看的错误文案：附带请求 ID 前 8 位，方便对照服务端日志
    function describeError(e) {
      const rid = e && e.requestId ? `（请求ID ${e.requestId.slice(0, 8)}）` : '';
      return `${(e && e.message) || e}${rid}`;
    }

    // RAG 轻量检索（自动融合笔记到行程 prompt）
    // 行程场景只做向量召回（不走 LLM 重排），延迟低；超时留给偶发的冷启动
    function callRAGRetrieve(query, styleLabel = '', topK = 5) {
      return postJson('/api/rag/retrieve',
        { query, top_k: topK, style_label: styleLabel, use_rerank: false },
        { timeoutMs: 15000, tag: 'rag' }); // { query, hits: [{title, text, similarity}], count, degraded }
    }

    function formatRAGSnippets(hits) {
      if (!hits || !hits.length) return '';
      return hits.map((h, i) => {
        const title = h.title ? `「${h.title}」` : '';
        return `【笔记${i + 1}】${title}\n${h.text}`;
      }).join('\n\n');
    }

    // 风格分类（agent_service /classify），10 秒超时，避免异常时阻塞后续行程生成
    // 传结构化字段，由服务端按训练数据的格式拼接，保证线上输入与训练分布一致
    function callLocalClassifier({ destination, preferences, message }) {
      return postJson('/api/classify', { destination, preferences, message },
        { timeoutMs: 10000, tag: 'classify' }); // { label, score, labels, source }
    }

    async function callLLMItinerary({ origin, destination, date, preferences, systemExtra, ragSnippets, chatHistory }) {
      const { ep } = getLLMSettings();
      if (!ep) throw new Error('缺少代理地址');

      const instruction = buildItineraryInstruction({ origin, destination, date, preferences, systemExtra, ragSnippets });
      // 规划指令作为 system，避免与对话历史首条 user 消息连续重复
      const messages = [{ role: 'system', content: instruction }];
      (chatHistory || []).forEach(msg => {
        if (!msg || !msg.content) return;
        if (msg.role === 'user') messages.push({ role: 'user', content: msg.content });
        if (msg.role === 'ai') messages.push({ role: 'assistant', content: msg.content });
      });

      // 服务端含 LLM 重试，最长约 3 分钟
      const data = await postJson(ep, { messages, temperature: 0.7 }, { timeoutMs: 180000, tag: 'llm' });
      const text = (data?.text || '').trim();
      if (!text) throw new ApiError('AI 未返回内容，请重试', { code: 'UPSTREAM_LLM_BAD_RESPONSE', retryable: true });
      return { title: destination ? `${destination} 行程规划` : 'AI 行程', text };
    }

    // ---------------- Agent 规划（Function Calling，SSE 流式进度） ----------------
    const USE_AGENT = true;

    // 读取 SSE：逐个解析 "event: x\ndata: {...}\n\n"
    async function callAgentStream(body, onEvent) {
      const resp = await fetch(`${API_BASE}/api/plan/stream`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      }).catch(() => { throw new ApiError('无法连接服务，请检查网关是否启动', { code: 'NETWORK_ERROR', retryable: true }); });
      if (!resp.ok) {
        const data = await resp.json().catch(() => null);
        const err = data?.error || {};
        throw new ApiError(err.message || `接口错误 ${resp.status}`, { code: err.code, requestId: err.request_id, status: resp.status });
      }
      const reader = resp.body.getReader();
      const decoder = new TextDecoder();
      let buffer = '';
      let result = null;
      while (true) {
        const { value, done } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });
        let idx;
        while ((idx = buffer.indexOf('\n\n')) >= 0) {
          const block = buffer.slice(0, idx);
          buffer = buffer.slice(idx + 2);
          const event = (block.match(/^event: (.*)$/m) || [])[1];
          const dataLine = (block.match(/^data: (.*)$/m) || [])[1];
          if (!event || !dataLine) continue;
          const data = JSON.parse(dataLine);
          if (DEBUG) console.log('[agent]', event, data);
          if (event === 'error') {
            const err = data.error || {};
            throw new ApiError(err.message || '规划失败', { code: err.code, retryable: err.retryable, requestId: err.request_id });
          }
          if (event === 'done') result = data;
          else onEvent(event, data);
        }
      }
      if (!result) throw new ApiError('规划中断，请重试', { code: 'STREAM_INTERRUPTED', retryable: true });
      return result;
    }

    // 一个原地更新的进度气泡，避免几十条工具调用刷屏
    function createProgressBubble() {
      const wrapper = document.createElement('div');
      wrapper.className = 'message system';
      const meta = document.createElement('div');
      meta.className = 'meta';
      meta.textContent = '规划进度';
      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      wrapper.appendChild(meta);
      wrapper.appendChild(bubble);
      chatLogEl.appendChild(wrapper);
      const counts = { search_notes: 0, poi_search: 0, route_plan: 0, get_weather: 0 };
      const labels = { search_notes: '📚 检索笔记', poi_search: '📍 查询地点', route_plan: '🧭 计算路线', get_weather: '🌤️ 查天气' };
      let stage = '准备中';
      let latest = '';
      const render = () => {
        const parts = Object.entries(counts).filter(([, n]) => n).map(([k, n]) => `${labels[k]} ×${n}`);
        bubble.textContent = `${stage}${latest ? `\n最近：${latest}` : ''}${parts.length ? `\n${parts.join('  ')}` : ''}`;
        chatLogEl.scrollTo({ top: chatLogEl.scrollHeight, behavior: 'smooth' });
      };
      render();
      return (event, data) => {
        if (event === 'status') stage = data.message;
        if (event === 'tool_call') {
          counts[data.tool] = (counts[data.tool] || 0) + 1;
          if (data.brief) latest = `${labels[data.tool] || data.tool} ${data.brief}`;
        }
        if (event === 'validation') {
          stage = data.passed ? '✅ 校验通过' : `🔧 校验发现 ${data.issues.length} 个问题，正在修正`;
        }
        render();
      };
    }

    // 结构化行程 → 地图页的数据格式（坐标已由 Agent 校验，地图页无需再做地理编码）
    function agentItineraryToMapJson(it) {
      return {
        title: it.title,
        days: it.days.map(d => ({
          title: d.theme || `第${d.day}天`,
          city: it.city,
          notes: null,
          places: d.stops.filter(s => s.location).map(s => ({
            name: s.name,
            address: s.address || null,
            location: { lng: s.location.lng, lat: s.location.lat, address: s.address || '', city: it.city },
            type: s.category,
            status: null,
            notes: (s.tips || []).join('；') || null,
            city: it.city
          }))
        }))
      };
    }

    async function runAgentPlan(body) {
      const onEvent = createProgressBubble();
      const result = await callAgentStream(body, onEvent);
      state.agentItinerary = result.itinerary;
      state.itineraryText = result.text;
      state.itineraryJson = agentItineraryToMapJson(result.itinerary);
      try {
        localStorage.setItem('wanderAi.itineraryText', result.text);

        localStorage.setItem('wanderAi.itineraryTitle', result.itinerary.title || 'AI 行程');
        localStorage.setItem('wanderAi.itinerarySource', 'agent');
      } catch (_) {}
      const v = result.validation || {};
      const summary = `地点 ${v.stops_resolved}/${v.stops} 已匹配真实 POI · 路线 ${v.legs_verified}/${v.legs} 段经高德实算`
        + (result.passed ? '' : ' · ⚠️ 部分问题未能自动修正');
      appendMessage('system', `${summary}（${(result.latency_ms / 1000).toFixed(0)} 秒）`);
      return result;
    }

    async function handleAiPlan() {
      const origin = document.getElementById('field-origin').value.trim();
      const destination = document.getElementById('field-destination').value.trim();
      const dateValue = document.getElementById('field-date').value;
      const preferenceItems = getSelectedPreferenceItems();
      const preferences = preferenceItems.map(item => item.display);
      const preferenceLabels = preferenceItems.map(item => item.label);
      const manualModelLabels = preferenceItems
        .map(item => item.modelLabel)
        .filter(Boolean);

      const days = Number(document.getElementById('field-days').value || 3);
      const note = document.getElementById('field-note').value.trim();
      const planRequest = `请为我规划从 ${origin || '未填写'} 前往 ${destination || '未填写'} 的行程，出发日期：${dateValue || '未填写'}，旅行偏好：${preferences.length ? preferences.join('、') : '未选择' }。${note ? `补充需求：${note}。` : ''}请生成 ${days} 天行程。`;
      appendMessage('user', planRequest);

      // 如果配置了 LLM，则优先请求真实模型；否则回退到本地示例
      const { ep } = getLLMSettings();
      try {
        let systemExtra = '';
        let ragSnippets = '';
        let detectedLabel = '';

        if (manualModelLabels.length) {
          const picked = manualModelLabels[0];
          detectedLabel = picked;
          systemExtra = `${buildSystemPromptByLabel(picked)}\n（手动指定偏好类型：${picked}）`;
          appendMessage('system', `已按你手动选择的标签规划：${picked}`);
        }

        // 构造 RAG 检索 query
        const ragQuery = [destination, origin, ...preferenceLabels].filter(Boolean).join(' ');

        // 先分类（如果没手动选），再用识别出的标签做 RAG 检索；任一失败不阻塞
        if (!manualModelLabels.length) {

          try {
            const cls = await callLocalClassifier({ destination, preferences: preferenceLabels, message: note });
            if (cls && cls.label) {
              detectedLabel = cls.label;
              const styleHead = buildSystemPromptByLabel(cls.label);
              systemExtra = `${styleHead}\n（偏好类型：${cls.label}，置信度约${Math.round((cls.score || 0) * 100)}%）`;
              if (DEBUG) console.log('[classify] applied label prompt', { label: cls.label, score: cls.score });
              appendMessage('system', `偏好识别：${cls.label}（${Math.round((cls.score || 0) * 100)}%）`);
            }
          } catch (err) {
            if (DEBUG) console.warn('[classify] skipped', err);
          }
        }

        // Agent 规划：成功直接返回；失败回退到下面的“检索笔记 + 文本生成”流程
        if (USE_AGENT && destination) {
          try {
            const result = await runAgentPlan({
              destination, origin, days, start_date: dateValue,
              preferences: preferenceLabels, style_prompt: systemExtra, message: note
            });
            state.tripContext = { origin, destination, date: dateValue, preferences, preferenceLabels, days };
            state.systemExtra = systemExtra;
            state.chatHistory = [{ role: 'user', content: planRequest }, { role: 'ai', content: result.text }];
            appendMessage('ai', `【AI生成行程】\n${result.text}`);
            setMapButtonsEnabled(true);
            showToast('行程已生成（智能规划）');
            return;
          } catch (err) {
            console.warn('[agent] failed, fallback to text generation', err);
            appendMessage('system', `⚠️ 智能规划暂不可用（${describeError(err)}），改用快速生成`);
          }
        }

        if (ragQuery.trim()) {
          try {
            const rag = await callRAGRetrieve(ragQuery, detectedLabel, 5);
            if (rag && rag.hits && rag.hits.length) {
              ragSnippets = formatRAGSnippets(rag.hits);
              if (DEBUG) console.log('[rag] retrieved snippets count:', rag.hits.length);
              appendMessage('system', `📚 已检索到 ${rag.hits.length} 条相关旅行笔记作为参考`);
            } else if (DEBUG) {
              console.warn('[rag] no hits');
            }
          } catch (err) {
            if (DEBUG) console.warn('[rag] skipped', err);
            appendMessage('system', '⚠️ 笔记检索暂不可用，本次行程未参考真实游记');
          }
        }

        state.tripContext = { origin, destination, date: dateValue, preferences, preferenceLabels, days };
        state.systemExtra = systemExtra;
        state.ragSnippets = ragSnippets;
        state.agentItinerary = null;
        state.chatHistory = [{ role: 'user', content: planRequest }];
        trimChatHistory();

        // 走代理只需 ep（和 body 里提供 model）；不强制要求前端有 key
        if (ep) {
          const { title, text } = await callLLMItinerary({
            origin,
            destination,
            date: dateValue,
            preferences,
            systemExtra,
            ragSnippets,
            chatHistory: state.chatHistory
          });
          state.itineraryText = text;
          state.itineraryJson = null;
          state.chatHistory.push({ role: 'ai', content: text });
          trimChatHistory();
          appendMessage('ai', `【AI生成行程】\n${text}`);
          try {
            localStorage.setItem('wanderAi.itineraryText', text);
            if (title) localStorage.setItem('wanderAi.itineraryTitle', title);
            localStorage.setItem('wanderAi.itinerarySource', 'text');
          } catch (_) {}
          setMapButtonsEnabled(true);
          showToast('行程已生成（LLM）');
          return;
        }
      } catch (e) {
        console.error(e);
        showToast('AI 生成失败，已回退示例行程：' + describeError(e), 'error');
      }

      const plan = buildMockPlan(destination, origin, dateValue, preferences);
      state.itineraryText = plan.text;
      state.itineraryJson = plan.json;
      appendMessage('ai', plan.summary);
      persistState(plan);
      setMapButtonsEnabled(true);
      showToast('行程已生成（示例）');
    }

    async function handleChatSend() {
      const inputEl = document.getElementById('chatInput');
      const text = (inputEl.value || '').trim();
      if (!text) {
        showToast('请输入对话内容', 'error');
        return;
      }
      if (!state.tripContext) {
        showToast('请先点击“AI规划行程”创建首轮行程', 'error');
        return;
      }

      inputEl.value = '';
      appendMessage('user', text);
      state.chatHistory.push({ role: 'user', content: text });
      trimChatHistory();

      // 上一版是 Agent 生成的：把它和修改意见一起交给 Agent，在原行程上修改
      if (USE_AGENT && state.agentItinerary) {
        try {
          const ctx = state.tripContext;
          const result = await runAgentPlan({
            destination: ctx.destination, origin: ctx.origin, days: ctx.days, start_date: ctx.date,
            preferences: ctx.preferenceLabels || [], style_prompt: state.systemExtra,
            message: text, previous_itinerary: state.agentItinerary
          });
          state.chatHistory.push({ role: 'ai', content: result.text });
          trimChatHistory();
          appendMessage('ai', result.text);
          return;
        } catch (err) {
          console.warn('[agent] revise failed, fallback', err);
          appendMessage('system', `⚠️ 智能修改暂不可用（${describeError(err)}），改用快速修改`);
          state.agentItinerary = null;
        }
      }

      try {
        // 多轮对话时也尝试 RAG 检索，用用户最新消息+目的地作为 query
        let ragSnippets = state.ragSnippets || '';
        try {
          const multiRagQuery = `${state.tripContext.destination || ''} ${text}`.trim();
          if (multiRagQuery) {
            const ragData = await callRAGRetrieve(multiRagQuery, '', 3);
            if (ragData && ragData.hits && ragData.hits.length) {
              ragSnippets = formatRAGSnippets(ragData.hits);
              if (DEBUG) console.log('[rag] multi-turn retrieved:', ragData.hits.length);
            }
          }
        } catch (ragErr) {
          if (DEBUG) console.warn('[rag] multi-turn retrieve skipped', ragErr);
        }

        const { text: reply } = await callLLMItinerary({
          origin: state.tripContext.origin,
          destination: state.tripContext.destination,
          date: state.tripContext.date,
          preferences: state.tripContext.preferences,
          systemExtra: state.systemExtra,
          ragSnippets,
          chatHistory: state.chatHistory
        });
        state.chatHistory.push({ role: 'ai', content: reply });
        trimChatHistory();
        state.itineraryText = reply;
        appendMessage('ai', reply);
        try {
          localStorage.setItem('wanderAi.itineraryText', reply);
          localStorage.setItem('wanderAi.itinerarySource', 'text');
        } catch (_) {}
      } catch (e) {
        console.error(e);
        showToast('对话失败：' + describeError(e), 'error');
      }
    }

    function handleViewMap() {
      if (!state.itineraryText) {
        try {
          const storedText = localStorage.getItem('wanderAi.itineraryText');
          if (!storedText) {
            showToast('请先让 AI 生成行程', 'error');
            return;
          }
        } catch (_) {
          showToast('请先让 AI 生成行程', 'error');
          return;
        }
      }
      window.location.href = './output-map.html';
    }

    function clearConversation() {
      chatLogEl.innerHTML = '';
      appendMessage('system', '已清空记录，可重新输入信息生成新行程。');
      state.itineraryJson = null;
      state.itineraryText = '';
      state.chatHistory = [];
      state.tripContext = null;
      state.systemExtra = '';
      state.ragSnippets = '';
      state.agentItinerary = null;
      try {
        localStorage.removeItem('wanderAi.itinerarySource');
        localStorage.removeItem('wanderAi.itineraryText');
        localStorage.removeItem('wanderAi.itineraryJson');
        localStorage.removeItem('wanderAi.itineraryTitle');
      } catch (_) {}
      setMapButtonsEnabled(false);
      showToast('历史对话已清空');
    }

    // Event bindings
    document.getElementById('prefTrigger').addEventListener('click', () => {
      document.getElementById('prefDialog').classList.add('active');
    });
    document.getElementById('prefCancel').addEventListener('click', () => {
      document.getElementById('prefDialog').classList.remove('active');
    });
    document.getElementById('prefConfirm').addEventListener('click', () => {
      document.getElementById('prefDialog').classList.remove('active');
      updatePreferenceSummary();
      showToast('已更新旅行偏好');
    });

    document.getElementById('aiPlanBtn').addEventListener('click', handleAiPlan);
    document.getElementById('manualBtn').addEventListener('click', () => {
      showToast('手动线路功能即将上线，敬请期待！', 'error');
    });
    document.getElementById('clearChatBtn').addEventListener('click', clearConversation);
    document.getElementById('chatSendBtn').addEventListener('click', handleChatSend);
    viewMapButtons.forEach(btn => btn.addEventListener('click', handleViewMap));
    document.getElementById('chatInput').addEventListener('keydown', evt => {
      if (evt.key === 'Enter' && !evt.shiftKey) {
        evt.preventDefault();
        handleChatSend();
      }
    });

    document.addEventListener('keydown', evt => {
      if (evt.key === 'Escape') {
        document.getElementById('prefDialog').classList.remove('active');
      }
    });

    // Initialize
    loadPersistedState();
    renderPreferenceOptions();
    updatePreferenceSummary();
  </script>
</body>
</html>
