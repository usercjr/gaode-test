# agent_service 非敏感配置（可提交）。密钥放 .env，临时覆盖用环境变量，如 LLM__MODEL=xxx。

llm:
  base_url: https://api.deepseek.com
  model: deepseek-chat
  timeout_s: 60
  max_concurrency: 8          # 同时进行的 LLM 调用上限
  retry_attempts: 3           # 含首次调用；仅对超时/429/5xx 重试
  breaker_failure_threshold: 5
  breaker_recovery_s: 30

rag:
  db_dir: agent_service/chroma_db   # 相对项目根目录
  collection: travel_notes
  embedding_model: BAAI/bge-small-zh-v1.5
  llm_model: ""                     # 为空则使用 llm.model
  data_dir: data                    # /ingest/csv 只允许读取该目录

retrieval:
  mode: hybrid                      # vector | bm25 | hybrid（BM25 + 向量，RRF 融合）
  candidate_k: 30                   # 每路召回候选数
  rerank_k: 20                      # 送入交叉编码器的候选数（CPU 约 140ms/条）
  rrf_k: 60
  rerank: cross_encoder             # cross_encoder | llm | none
  reranker_model: BAAI/bge-reranker-base
  reranker_max_length: 256
  city_filter: true                 # 查询里出现城市/省份时只检索相关笔记
  metadata_path: data/notes_metadata.jsonl

server:
  host: 127.0.0.1
  port: 8002

logging:
  level: INFO
  dir: logs
  retention_days: 14
